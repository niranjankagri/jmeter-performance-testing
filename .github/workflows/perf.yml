# CI: unit tests and the smoke profile on every push; load and spike follow; stress weekly and by hand.
# Each job starts its own copy of the API, so the tests put load on nobody else's server.
name: Performance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: a broken dependency shows up without a code change, and the stress profile runs
    - cron: '30 22 * * 5'   # Friday 22:30 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: perf-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Unit tests and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests, then the smoke profile with its SLO gate
        run: ./mvnw -B verify
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Smoke" >> "$GITHUB_STEP_SUMMARY"
          cat target/slo-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the HTML dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-smoke
          path: target/jmeter/reports/booking
          if-no-files-found: warn
          retention-days: 14

  performance:
    name: ${{ matrix.profile }}
    # The smoke test is the gate: no point loading an API that doesn't work
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [load, spike, stress]
        # Stress takes the longest and looks for the limit, so it isn't needed on every push
        exclude:
          - profile: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'none' || 'stress' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the ${{ matrix.profile }} profile with its SLO gate
        run: ./mvnw -B verify -P${{ matrix.profile }} -DskipTests
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## ${{ matrix.profile }}" >> "$GITHUB_STEP_SUMMARY"
          cat target/slo-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the HTML dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ matrix.profile }}
          path: target/jmeter/reports/booking
          if-no-files-found: warn
          retention-days: 14
