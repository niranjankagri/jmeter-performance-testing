# 30 users, about 60 % of the booking limit. Measured locally: Book seats p95 104 ms, Browse 24 ms, Check 9 ms.
# The limits leave room for a slower CI runner.
# minSamples is a guard: results from a shorter run, or an old file, can't pass.

Login.p95Ms=1000
Login.maxErrorPercent=0
Login.minSamples=30

Browse\ events.p95Ms=150
Browse\ events.maxErrorPercent=0
Browse\ events.minSamples=3000

Book\ seats.p95Ms=300
Book\ seats.maxErrorPercent=0
Book\ seats.minSamples=3000

Check\ booking.p95Ms=100
Check\ booking.maxErrorPercent=0
Check\ booking.minSamples=3000

Check\ no\ overselling.p95Ms=2000
Check\ no\ overselling.maxErrorPercent=0
Check\ no\ overselling.minSamples=1
